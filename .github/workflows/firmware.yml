name: Firmware build and release

on:
  push:
    branches: [blackbox-fm1]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch pinned project-local build inputs
        run: make setup
      - name: Fetch pinned offline ROM-reader test peer
        run: |
          git clone --no-checkout https://github.com/isod89/openpocket.git artifacts/reference/openpocket
          git -C artifacts/reference/openpocket checkout --detach 995c84b5df53aace5d83478e66e85b37d0fa4372
          curl --fail --location --retry 3 --output artifacts/downloads/wl82loader-c32b28e.bin \
            https://raw.githubusercontent.com/kagaimiq/jl-uboot-tool/c32b28e7a04f873f526ba929cb1bae9f05442fe9/data/loaderblobs/usb/wl82loader.bin
          .venv/bin/python tools/blackbox_dump.py --check
      - name: Build all profiles and verify deterministic V17 rebuild
        shell: bash
        run: |
          mkdir -p artifacts/logs
          for board in blackbox-v17 blackbox-v20 blackbox-v23; do
            make build BOARD="$board" > "artifacts/logs/$board.log" 2>&1
          done
          cp build/blackbox-v17/blackbox-fm1-950.fwsc artifacts/v17-first.fwsc
          make build BOARD=blackbox-v17 > artifacts/logs/v17-rebuild.log 2>&1
          cmp artifacts/v17-first.fwsc build/blackbox-v17/blackbox-fm1-950.fwsc
      - name: Host tests (never opens a device)
        run: make test
      - name: Simulated V17 update and monitor loop (no hardware)
        run: make simulate BOARD=blackbox-v17 > artifacts/logs/v17-simulation.log 2>&1
      - name: Assemble firmware, corresponding source and licences
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          version=v0.0.0-ci
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          .venv/bin/python tools/release_blackbox.py --version "$version" --output artifacts/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: artifacts/logs/
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - name: Publish experimental pre-release only after successful build/tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --prerelease \
            --title "blackbox-fm1 $RELEASE_TAG — experimental V17" \
            --notes-file release/RELEASE-NOTES.md
